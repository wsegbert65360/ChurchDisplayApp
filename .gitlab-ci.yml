# GitLab CI configuration for WPF .NET 8 project
# Requires a Windows runner (SaaS Windows runners are available on GitLab.com)

stages:
  - build

variables:
  DOTNET_VERSION: '8.0.x'

build_job:
  stage: build
  tags:
    # Recommended tag for GitLab.com SaaS Windows runners
    - saas-windows-medium-amd64
  script:
    # The root folder holds both the .sln and the .csproj, so name the solution explicitly.
    - dotnet restore ChurchDisplayApp.sln
    - dotnet build ChurchDisplayApp.sln --configuration Release --no-restore
    - dotnet test tests/ChurchDisplayApp.Tests/ChurchDisplayApp.Tests.csproj --configuration Release --no-build
  artifacts:
    name: "ChurchDisplayApp-Release-$CI_COMMIT_SHORT_SHA"
    paths:
      - bin/Release/net8.0-windows/
    expire_in: 1 week
